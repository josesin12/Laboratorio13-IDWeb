<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 8</title>
</head>
<body>

  <h1>Ejercicio 8</h1>

  <button onclick="aleatorio()">Obtener Pokémon aleatorio</button>

  <script src="ejercicio8.js">
    function aleatorio() {
      let id = Math.floor(Math.random() * 898) + 1;

      fetch(`https://pokeapi.co/api/v2/pokemon/${id}`)
        .then(res => res.json())
        .then(data => {
          console.log("ID aleatorio:", id);
          console.log("Pokémon:", data.name);
        })
        .catch(err => console.log("Error:", err));
    }
  </script>

</body>
</html>
