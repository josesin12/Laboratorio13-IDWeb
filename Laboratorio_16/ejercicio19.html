<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 19:</title>
</head>
<body>
    <h3>Modificar Objeto y Re-convertir a JSON</h3>
    <p>Revisa la consola (F12) para ver la modificación de edad y estado.</p>

    <script>
        const jsonOriginal = '{"nombre": "Manuel", "edad": 28, "activo": true}';
        console.log("1. JSON Original:", jsonOriginal);

        let objetoJS = JSON.parse(jsonOriginal);
        console.log("2. Objeto JS Original:", objetoJS);

        objetoJS.edad = 29;
        objetoJS.activo = false;
        console.log("3. Objeto JS Modificado:", objetoJS);

        const jsonActualizado = JSON.stringify(objetoJS);
        console.log("4. JSON Actualizado:", jsonActualizado);
    </script>
</body>
</html>
