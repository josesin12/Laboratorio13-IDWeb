<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14:</title>
</head>
<body>
    <h3>JSON.stringify()</h3>
    <p>Revisa la consola (F12) para ver la conversión del objeto JS a JSON.</p>

    <script>
        const persona = {
            nombre: "Elías",
            edad: 30,
            ciudad: "Arequipa"
        };

        const jsonPersona = JSON.stringify(persona);

        console.log("Objeto JS:", persona);
        console.log("Cadena JSON:", jsonPersona);
    </script>
</body>
</html>
