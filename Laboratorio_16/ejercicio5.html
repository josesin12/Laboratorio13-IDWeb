<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5:</title>
    <style>
        .oscuro {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <button id="btnModo">Activar O Desactivar Modo Oscuro</button>
    <p>Prueba el modo oscuro.</p>

    <script>
       
        
        const btn = document.getElementById("btnModo");
        const body = document.body;

        btn.addEventListener("click", () => {
            // Usa toggle para alternar la clase "oscuro" en body
            body.classList.toggle("oscuro");
        });
    </script>
</body>
</html>
