<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10:</title>
    <style>
        table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 8px; }
    </style>
</head>
<body>
    <button id="btnGenerarTabla">Generar Tabla de Productos</button>
    <div id="contenedorTabla"></div>

    <script>
        const productos = [
            {nombre: "Laptop", precio: 3500 },
            {nombre: "Mouse", precio: 80 },
            {nombre: "Teclado", precio: 150 }
        ];

        const btn = document.getElementById('btnGenerarTabla');
        const contenedor = document.getElementById('contenedorTabla');

        const generarTablaHTML = (data) => {
            let html = '<table><thead><tr><th>Nombre</th><th>Precio</th></tr></thead><tbody>';
            data.forEach(item => {
                html += `<tr><td>${item.nombre}</td><td>${item.precio}</td></tr>`;
            });
            html += '</tbody></table>';
            return html;
        };

        btn.addEventListener('click', () => {
            contenedor.innerHTML = generarTablaHTML(productos);
        });
    </script>
</body>
</html>
