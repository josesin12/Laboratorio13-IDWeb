<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6:</title>
</head>
<body>
    <button id="btnResta">-</button>
    <span id="contador" style="font-size: 2em; margin: 0 10px;">0</span>
    <button id="btnSuma">+</button>
    <p id="mensaje" style="color: red;"></p>

    <script>
     
        
        const btnResta = document.getElementById("btnResta");
        const btnSuma = document.getElementById("btnSuma");
        const contadorSpan = document.getElementById("contador");
        const mensajeP = document.getElementById("mensaje");
        let contador = 0;

        btnSuma.addEventListener("click", () => {
            contador++;
            contadorSpan.textContent = contador;
            mensajeP.textContent = "";
        });

        btnResta.addEventListener("click", () => {
            if (contador > 0) {
                contador--;
                contadorSpan.textContent = contador;
                mensajeP.textContent = "";
            } else {
               
                mensajeP.textContent = "El contador no puede ser menor a cero.";
            }
        });
    </script>
</body>
</html>
